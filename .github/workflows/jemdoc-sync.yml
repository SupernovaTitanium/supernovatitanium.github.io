name: jemdoc sync check

on:
  push:
    paths: ["*.html", "_jemdoc/**", ".github/workflows/jemdoc-sync.yml"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python _jemdoc/build.py --check
